spring:
  application:
    name: modular-rag
  ai:
    mcp:
      client:
        stdio:
          connections:
            tavily-search:
              command: npx
              args:
                - "-y"
                - "tavily-mcp@0.2.22"
              env:
                TAVILY_API_KEY: ${TAVILY_SEARCH_API_KEY}
    ollama:
      init:
        pull-model-strategy: when_missing
      chat:
          model: ministral-3:8b
      embedding:
          model: granite-embedding:278m
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
  threads:
    virtual:
      enabled: true

logging:
  level:
    org.springframework.ai.rag: debug

arconia:
  dev:
    services:
      lgtm:
        enabled: true
      phoenix:
        enabled: false
  observations:
    conventions:
      openinference:
        ai:
          enabled: false
